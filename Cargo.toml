[package]
name = "ausnd"
version = "0.6.1"
description = "Reader and writer for the AU audio format"
repository = "https://github.com/karip/ausnd"
license = "MIT OR Apache-2.0"
keywords = ["audio", "au", "codec"]
categories = ["multimedia::audio", "multimedia::encoding"]
edition = "2024"
rust-version = "1.87.0"
exclude = [
    "toisto-au-test-suite/*",
]

[dependencies]
audio-codec-algorithms = "0.8.0"

[dev-dependencies]
criterion = { version = "0.8.2" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[[bench]]
name = "au_benchmark"
harness = false
